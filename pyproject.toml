[project]
name = "lottie-orchestrator"
version = "3.2.0"
description = "Provider-agnostic multi-agent framework with shared knowledge & AI governance"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bandit>=1.9.4",
    "detect-secrets>=1.5.0",
    "jinja2>=3.1.6",
    "langchain-core>=1.4.0",
    "litellm>=1.86.2",
    # mypy + ruff are runtime deps: the rule-13 code-write gate (SchemaValidatorSkill,
    # used by `lottie create --from-desc`) shells out to them, so end users need them.
    "mypy>=2.1.0",
    "networkx>=3.6.1",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "ruff>=0.15.14",
    "typer>=0.26.2",
]

[project.optional-dependencies]
chroma = ["chromadb>=1.5.9"]
serve = ["mcp>=1.27.2"]
mesh = [
    "langgraph>=1.2.4",
    "langgraph-checkpoint-sqlite>=2.0.0",
]
otel = [
    "opentelemetry-sdk>=1.42",
    "opentelemetry-exporter-otlp-proto-http>=1.42",
]
api = [
    "starlette>=1.2.1",
    "uvicorn>=0.49",
]

[project.scripts]
lottie = "lottie.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "types-networkx>=3.6.1.20260518",
    "types-pyyaml>=6.0.12.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lottie"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["detect_secrets.*", "bandit.*", "chromadb.*", "langgraph.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src", "skills", "agents", "tests"]
