[project]
name = "lottie-orchestrator"
version = "0.1.0"
description = "Provider-agnostic multi-agent framework with shared knowledge & AI governance"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "langchain-core>=1.4.0",
    "litellm>=1.86.2",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "typer>=0.26.2",
]

[project.scripts]
lottie = "lottie.cli:app"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lottie"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src", "skills", "agents", "tests"]
