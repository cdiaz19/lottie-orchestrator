# ResearchAgent eval suite — agents/research/evals.yaml
#
# These cases exercise the full ResearchAgent pipeline end-to-end:
#   RetrievalSkill → LLM reasoning → SummarizerSkill → ResearchOutput.
#
# Running against real knowledge + real provider
# -----------------------------------------------
# Use: lottie benchmark agent research --provider <provider>
# Meaningful quality expectations require a populated knowledge base and a real
# LLM provider.  In automated CI the suite runs with MockLLMProvider + mock/embed,
# which always returns a non-empty digest — so the `contains: {digest: ""}` checks
# are structurally valid (always-true) and confirm the pipeline runs without error.
#
# LLM call budget per case: 2 (one for agent.complete, one for SummarizerSkill).
# For N cases the MockLLMProvider must be seeded with at least 2*N responses.

cases:
  - name: multi-agent query returns non-empty digest
    input:
      query: "What are multi-agent AI systems?"
      k: 5
      layers: []
      expand_graph: true
      max_points: 3
    expect:
      # Always-true with any mock: confirms pipeline produces a digest field.
      # Against a populated knowledge base, expect "agent" to appear in the answer.
      contains:
        digest: ""

  - name: coordination query returns digest
    input:
      query: "How do agents coordinate in a multi-agent system?"
      k: 3
      layers: []
      expand_graph: false
      max_points: 5
    expect:
      contains:
        digest: ""

  - name: minimal query no filters
    input:
      query: "What is Lottie?"
      k: 5
      layers: []
      expand_graph: false
      max_points: 5
    expect:
      contains:
        digest: ""

  - name: k=1 returns single hit digest
    input:
      query: "knowledge layer"
      k: 1
      layers: []
      expand_graph: false
      max_points: 2
    expect:
      contains:
        digest: ""
