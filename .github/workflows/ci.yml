name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync dependencies
        # ALL extras: otel (else mypy --strict can't resolve the optional OTLP exporter import) and
        # api/Starlette (else the HTTP transport tests importorskip and silently skip in CI).
        run: uv sync --dev --all-extras
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy --strict src
      - name: Tests with coverage (report only)
        run: uv run pytest -q --cov=lottie --cov-report=term-missing --cov-report=xml
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
